# Phase 2a probe: do characters driven by sim/bt/evacuate*.json walk to an exit on the alarm?
# 3 characters, spawn anywhere, alarm at 3-8 s, MoveTo /World/ExitTargets/E1, 45 s.
# Stage = hospital.usd + ExitTargets (sim/make_exit_targets.py). Needs the NavMesh-cap patch bind-mount.
isaacsim.replicator.agent:
  version: 1.6.0
  seed: 42
  simulation_duration: 45.0
  environment:
    base_stage_asset_path: /workspace/assets/hospital/hospital_evac.usda
  sensor:
    groups:
      exit_cam:              # aim at the exit prim (an Xform: no mesh -> IRA uses its position, no bbox unpack)
        num: 1
        aim_at_targets:
          targets: ["/World/ExitTargets/E1"]
          height_range: [2.5, 3.0]
          look_down_angle_range: [25.0, 45.0]
          focal_length_range: [10.0, 15.0]
          distance_range: [3.5, 7.0]
      ceiling_cameras:       # fallback so a writer exists even if exit_cam fails
        num: 1
        maximum_coverage:
          height_range: [2.5, 3.0]
          look_down_angle_range: [25.0, 45.0]
          focal_length_range: [10.0, 15.0]
          distance_range: [3.5, 7.0]
          grid_resolution: 2.0
          target_coverage_ratio: 0.6
  character:
    groups:
      evac:
        num: 3
        asset_path: Isaac/People/Characters/
        behavior_tree: /workspace/sim/bt/evacuate_test_E1.json
  replicator:
    writers:
      IRABasicWriter:
        output_dir: /workspace/results/ira_hospital_evac_test
        resolution: [640, 360]
        semantic_filter_predicate: class:character|robot;id:*
        rgb: true
        camera_params: true
        object_info_bounding_box_2d_tight: true
        object_info_bounding_box_3d: true
        start_frame: 20
